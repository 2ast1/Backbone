name: Backbone
description: $description
prefix: Backbone
version: '${version}'

main: de.basti.backbone.Backbone
api-version: '26.1'
softdepend: [ Vault ]

authors: [ 2ast1 ]
website: bttlr.de

commands:
  ban:
    description: Bans a player temporarily or permanently
    permission: backbone.ban
    usage: /ban <player> [time] [reason]
  unban:
    description: Lifts a player's ban
    permission: backbone.unban
    usage: /unban <player>
  mute:
    description: Mutes a player temporarily or permanently
    permission: backbone.mute
    usage: /mute <player> [time] [reason]
  unmute:
    description: Lifts a player's mute
    permission: backbone.unmute
    usage: /unmute <player>
  warn:
    description: Warns a player with a specified reason
    permission: backbone.warn
    usage: /warn <player> <reason>
  warns:
    description: Displays all warnings of a player
    permission: backbone.warn
    usage: /warns <player>
  kick:
    description: Kicks an online player from the server
    permission: backbone.kick
    usage: /kick <player> [reason]
  prefix:
    description: Displays a player's prefix
    permission: backbone.prefix
    usage: /prefix [player]
  setprefix:
    description: Sets the prefix for yourself or another player
    permission: backbone.prefix
    usage: /setprefix [player] <prefix>
  removeprefix:
    description: Removes the prefix from yourself or another player
    aliases: [ delprefix, deleteprefix ]
    permission: backbone.prefix
    usage: /removeprefix [player]
  namecolor:
    description: Displays a player's name color
    permission: backbone.namecolor
    usage: /namecolor [player]
  setnamecolor:
    description: Sets the name color for yourself or another player
    aliases: [ setNameColor ]
    permission: backbone.namecolor
    usage: /setnamecolor [player] <colorcode>
  removenamecolor:
    description: Removes the name color from yourself or another player
    aliases: [ removeNameColor, delnamecolor, deletenamecolor ]
    permission: backbone.namecolor
    usage: /removenamecolor [player]
  backbone:
    description: Main command for the Backbone plugin
    aliases: [ bb ]
    permission: backbone.admin
    usage: /backbone <setup|reload|github|version>
  compact:
    description: Offloads unused plugin caches from RAM to disk and frees memory
    permission: backbone.compact
    usage: /compact
  ram:
    description: Displays detailed RAM usage by process, subsystem, and memory pool
    permission: backbone.ram
    usage: /ram
  health:
    description: Displays detailed TPS, server health diagnostics, and scans for lag machines
    permission: backbone.health
    usage: /health
  rank:
    description: Manages ranks, permissions, and rank purchases
    aliases: [ ranks ]
    usage: /rank <help|list|info|set|create|delete|setdefault|perm|player|promote|demote|offer|buy|setprice|setduration|setprev|setnext|shop|setname|setcolor|setprefix|enable|disable>
  setrank:
    description: Assigns a rank to a player
    permission: backbone.rank.set
    usage: /setrank <player> <rank> [duration]

  # Inventory & Enderchest
  inventory:
    description: Opens and manages a player's inventory (including offline players)
    aliases: [ inv, openinv, invsee ]
    permission: backbone.inventory
    usage: /inventory <player>
  enderchest:
    description: Opens a player's Enderchest (including offline players)
    aliases: [ ec, openenderchest, openec, ender ]
    permission: backbone.enderchest
    usage: /enderchest [player]
  craft:
    description: Opens a portable crafting table anywhere
    aliases: [ workbench, wbench ]
    permission: backbone.craft
    usage: /craft
  trash:
    description: Opens a disposal inventory that destroys inserted items
    aliases: [ dispose, muell ]
    permission: backbone.trash
    usage: /trash

  # Flight, Hide & Gamemode Commands
  fly:
    description: Enables or disables flight mode
    aliases: [ flight ]
    permission: backbone.fly
    usage: /fly [player]
  hide:
    description: Makes you completely invisible to all players without backbone.hide.see
    aliases: [ vanish ]
    permission: backbone.hide
    usage: /hide [player]
  gamemode:
    description: Changes the gamemode
    aliases: [ gm ]
    permission: backbone.gamemode
    usage: /gamemode <0|1|2|3|survival|creative|adventure|spectator> [player]
  creative:
    description: Sets the gamemode to Creative
    aliases: [ c, gmc ]
    permission: backbone.gamemode
    usage: /creative [player]
  survival:
    description: Sets the gamemode to Survival
    aliases: [ s, gms ]
    permission: backbone.gamemode
    usage: /survival [player]
  adventure:
    description: Sets the gamemode to Adventure
    aliases: [ a, gma ]
    permission: backbone.gamemode
    usage: /adventure [player]
  spectator:
    description: Sets the gamemode to Spectator
    aliases: [ sp, gmsp ]
    permission: backbone.gamemode
    usage: /spectator [player]
  heal:
    description: Restores health, food and saturation for a player
    permission: backbone.heal
    usage: /heal [player]
  feed:
    description: Fills a player's hunger bar and saturation
    permission: backbone.feed
    usage: /feed [player]
  speed:
    description: Adjusts walking or flying speed (1-100)
    permission: backbone.speed
    usage: /speed [player] <walk|fly> <1-100>
  skull:
    description: Gives the head of yourself or specified player
    aliases: [ head ]
    permission: backbone.skull
    usage: /skull [player]

  # Maintenance Mode
  maintenance:
    description: Manages maintenance mode
    aliases: [ wartung, maintnaice, maintance ]
    permission: backbone.maintenance
    usage: /maintenance [on|off|toggle|status|message <message>|reset]

  # Time Control
  day:
    description: Sets the time to Day
    permission: backbone.time
    usage: /day
  night:
    description: Sets the time to Night
    permission: backbone.time
    usage: /night
  sunrise:
    description: Sets the time to Sunrise
    permission: backbone.time
    usage: /sunrise
  sunset:
    description: Sets the time to Sunset
    permission: backbone.time
    usage: /sunset

  # Weather Control
  sun:
    description: Sets the weather to sunny
    aliases: [ clear ]
    permission: backbone.weather
    usage: /sun
  rain:
    description: Sets the weather to rain
    permission: backbone.weather
    usage: /rain
  storm:
    description: Sets the weather to storm
    aliases: [ thunder ]
    permission: backbone.weather
    usage: /storm

  # Teleport Requests (TPA)
  tpa:
    description: Sends a teleport request to a player or accepts/denies one
    permission: backbone.tpa
    usage: /tpa <player|accept|deny>
  tpaccept:
    description: Accepts a pending teleport request
    aliases: [ tpyes ]
    permission: backbone.tpa
    usage: /tpaccept
  tpdeny:
    description: Denies a pending teleport request
    aliases: [ tpno ]
    permission: backbone.tpa
    usage: /tpdeny

  # Lobby System
  lobby:
    description: Teleports to the server lobby
    aliases: [ hub ]
    permission: backbone.lobby
    usage: /lobby
  setlobby:
    description: Sets the server lobby location
    permission: backbone.setlobby
    usage: /setlobby [true|false]

  # Warp System
  warp:
    description: Teleports to a warp or manages blacklisted worlds
    permission: backbone.warp
    usage: /warp [name|blacklistworld <world>]
  warps:
    description: Lists all available warps
    permission: backbone.warp
    usage: /warps
  setwarp:
    description: Creates a new warp
    permission: backbone.setwarp
    usage: /setwarp <name>
  delwarp:
    description: Deletes an existing warp
    aliases: [ deletewarp, removewarp ]
    permission: backbone.delwarp
    usage: /delwarp <name>

  # Home System
  home:
    description: Teleports to one of your homes or manages blacklisted worlds
    permission: backbone.home
    usage: /home [name|blacklistworld <world>]
  homes:
    description: Lists all of your homes
    permission: backbone.home
    usage: /homes
  sethome:
    description: Sets a new home
    permission: backbone.sethome
    usage: /sethome [name]
  delhome:
    description: Deletes an existing home
    aliases: [ deletehome, removehome ]
    permission: backbone.delhome
    usage: /delhome [name]

  # Spawn System
  spawn:
    description: Teleports to the spawn of the current world
    permission: backbone.spawn
    usage: /spawn
  setworldspawn:
    description: Sets the spawn point for the current world
    permission: backbone.setworldspawn
    usage: /setworldspawn [true|false]
  back:
    description: Teleports you to your last death location
    permission: backbone.back
    usage: /back

  # Economy System
  money:
    description: Displays or manages your own or another player's balance
    aliases: [ bal, balance ]
    permission: backbone.money
    usage: /money [player|give|take|set]
  pay:
    description: Transfers money to another player
    permission: backbone.pay
    usage: /pay <player> <amount>
  paytoggle:
    description: Toggles whether you can receive money payments
    aliases: [ togglepay ]
    permission: backbone.pay
    usage: /paytoggle
  baltop:
    description: Displays the richest players on the server
    aliases: [ balancetop, moneytop ]
    permission: backbone.money.others
    usage: /baltop [page]

  # Scoreboard System
  scoreboard:
    description: Toggles the scoreboard or manages scoreboards
    aliases: [ sb ]
    permission: backbone.scoreboard
    usage: /scoreboard [on|off|toggle|reload|list|show|hide]

  # Private Messaging
  msg:
    description: Sends a private message to a player or console
    aliases: [ tell, whisper, w, m, pm, dm ]
    permission: backbone.msg
    usage: /msg <player> <message>
  reply:
    description: Replies to the last received private message
    aliases: [ r ]
    permission: backbone.reply
    usage: /reply <message>
  slowchat:
    description: Restricts chat frequency or toggles slowchat
    permission: backbone.slowchat
    usage: /slowchat [duration]
  staffchat:
    description: Sends messages in the team staff chat
    aliases: [ sc ]
    permission: backbone.staffchat
    usage: /staffchat <message>
  chatclear:
    description: Clears the public chat
    aliases: [ cc, clearchat ]
    permission: backbone.chatclear
    usage: /chatclear
  actionbar:
    description: Displays a custom action bar message to a player or all players
    aliases: [ ab ]
    permission: backbone.actionbar
    usage: /actionbar <broadcast|player> <text> <duration|perm>

